services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streetlight_db}
      POSTGRES_USER: ${POSTGRES_USER:-streetlight_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streetlight_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streetlight_app} -d ${POSTGRES_DB:-streetlight_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-streetlight_app}:${POSTGRES_PASSWORD:-streetlight_secret_2026}@postgres:5432/${POSTGRES_DB:-streetlight_db}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
